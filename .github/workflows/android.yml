name: Build Android Cast APK
on:
  workflow_dispatch:
  push:
    paths: ['android-cast/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: android-cast
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DisplayStream-Cast-debug-apk
          path: android-cast/app/build/outputs/apk/debug/app-debug.apk
