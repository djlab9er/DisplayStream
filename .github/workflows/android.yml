name: Build Android Cast APK
on:
  workflow_dispatch:
  push:
    paths: ['android-cast/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: android-cast
        run: |
          set +e
          gradle --no-daemon assembleDebug > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Could not|Execution failed|> " build.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:380}"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: DisplayStream-Cast-debug-apk
          path: android-cast/app/build/outputs/apk/debug/app-debug.apk
