<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="Gemini">
  <title>Gemini</title>
  <link rel="stylesheet" href="gemini.css">
</head>
<body>
  <main>
    <h1>GEMINI</h1>
    <p id="status" class="status" role="status" aria-live="polite">Starting…</p>
    <div id="pair" hidden>
      <p class="hint">In the Gemini Glasses phone app, enter this launcher code</p>
      <p id="code" class="code" aria-label="Launcher code">········</p>
    </div>
    <button type="button" id="go" autofocus>Start Gemini</button>
  </main>
  <noscript>This app needs JavaScript.</noscript>
  <script src="gemini.js"></script>
</body>
</html>
